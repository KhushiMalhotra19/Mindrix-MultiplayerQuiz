<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Dark Blue Circle Background -->
  <circle cx="250" cy="250" r="230" fill="#1E3A8A" stroke="#0F2557" stroke-width="12" />
  
  <!-- Drooping Puppy Ears -->
  <path d="M 120,170 C 80,220 70,300 130,320 C 160,325 180,280 160,210 Z" fill="#92400E" stroke="#451A03" stroke-width="8" stroke-linejoin="round" />
  <path d="M 380,170 C 420,220 430,300 370,320 C 340,325 320,280 340,210 Z" fill="#92400E" stroke="#451A03" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Head Base - Golden Tan Puppy -->
  <ellipse cx="250" cy="250" rx="135" ry="120" fill="#D97706" stroke="#451A03" stroke-width="10" />
  
  <!-- Snout / Muzzle -->
  <ellipse cx="250" cy="280" rx="75" ry="55" fill="#FDE68A" stroke="#451A03" stroke-width="6" />
  
  <!-- Cute Nose -->
  <path d="M 232,250 L 268,250 C 275,250 275,270 250,278 C 225,270 225,250 232,250 Z" fill="#451A03" />
  
  <!-- Happy Open Mouth & Tongue -->
  <path d="M 230,290 C 240,315 260,315 270,290" fill="none" stroke="#451A03" stroke-width="6" stroke-linecap="round" />
  <path d="M 240,300 C 240,325 260,325 260,300 Z" fill="#EF4444" stroke="#451A03" stroke-width="4" />
  
  <!-- Big Cute Puppy Eyes -->
  <circle cx="185" cy="225" r="22" fill="#451A03" />
  <circle cx="190" cy="220" r="7" fill="#FFFFFF" />
  <circle cx="180" cy="230" r="3" fill="#FFFFFF" />
  
  <circle cx="315" cy="225" r="22" fill="#451A03" />
  <circle cx="320" cy="220" r="7" fill="#FFFFFF" />
  <circle cx="310" cy="230" r="3" fill="#FFFFFF" />
  
  <!-- Cute Red Collar with Gold Bell -->
  <rect x="180" y="340" width="140" height="24" rx="8" fill="#DC2626" stroke="#451A03" stroke-width="5" />
  <circle cx="250" cy="365" r="14" fill="#F59E0B" stroke="#451A03" stroke-width="4" />
  <line x1="250" y1="365" x2="250" y2="375" stroke="#451A03" stroke-width="3" />
</svg>
