<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Dark Teal Circle Background -->
  <circle cx="250" cy="250" r="230" fill="#144548" stroke="#0A282A" stroke-width="12" />
  
  <!-- Fox Ears -->
  <polygon points="100,230 140,80 230,190" fill="#E65C00" stroke="#2B1400" stroke-width="8" stroke-linejoin="round" />
  <polygon points="120,215 145,105 205,185" fill="#2B1400" />
  
  <polygon points="270,190 360,80 400,230" fill="#E65C00" stroke="#2B1400" stroke-width="8" stroke-linejoin="round" />
  <polygon points="295,185 355,105 380,215" fill="#2B1400" />
  
  <!-- Head Base -->
  <polygon points="110,230 390,230 250,420" fill="#E65C00" stroke="#2B1400" stroke-width="10" stroke-linejoin="round" />
  <polygon points="160,230 250,230 205,330" fill="#FFFFFF" />
  <polygon points="250,230 340,230 295,330" fill="#FFFFFF" />
  <polygon points="205,330 295,330 250,410" fill="#FFFFFF" />
  
  <!-- Nose -->
  <ellipse cx="250" cy="385" rx="18" ry="14" fill="#2B1400" />
  
  <!-- Eyes -->
  <circle cx="190" cy="265" r="16" fill="#2B1400" />
  <circle cx="194" cy="261" r="5" fill="#FFFFFF" />
  
  <circle cx="310" cy="265" r="16" fill="#2B1400" />
  <circle cx="314" cy="261" r="5" fill="#FFFFFF" />
  
  <!-- Smart Black Eyeglasses -->
  <rect x="145" y="235" width="90" height="65" rx="14" fill="none" stroke="#101010" stroke-width="10" />
  <rect x="265" y="235" width="90" height="65" rx="14" fill="none" stroke="#101010" stroke-width="10" />
  <line x1="235" y1="260" x2="265" y2="260" stroke="#101010" stroke-width="10" />
  <line x1="115" y1="260" x2="145" y2="260" stroke="#101010" stroke-width="8" />
  <line x1="355" y1="260" x2="385" y2="260" stroke="#101010" stroke-width="8" />
</svg>
